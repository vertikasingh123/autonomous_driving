# Stronger model: DeepLabV3+ with an ImageNet-pretrained ResNet-50 encoder.
# Needs more GPU memory than the U-Net baseline; lower batch_size if it runs out.
output_dir: outputs/deeplabv3plus_r50

data:
  root: data/cityscapes
  crop_size: [512, 1024]
  scale_range: [0.5, 2.0]
  batch_size: 8
  val_batch_size: 4
  num_workers: 4

model:
  arch: deeplabv3plus
  encoder: resnet50
  lr: 3.0e-4
  weight_decay: 1.0e-4
  dice_weight: 0.5

trainer:
  max_epochs: 60
  precision: 16-mixed
  check_val_every_n_epoch: 2
