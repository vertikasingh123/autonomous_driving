[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cityseg"
version = "1.0.0"
description = "Semantic segmentation of urban driving scenes on Cityscapes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "lightning>=2.2",
    "segmentation-models-pytorch>=0.3.3",
    "torchmetrics>=1.0",
    "numpy",
    "pillow",
    "pyyaml",
    "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
demo = ["gradio>=4.0"]
data = ["cityscapesscripts"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
